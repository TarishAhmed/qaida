# Draft build recipe for submission to fdroiddata (https://gitlab.com/fdroid/fdroiddata).
# Submit only once real content is in app/src/main/assets/content: release builds refuse to package
# without it. Version fields follow app/build.gradle.kts, which release tags must match.
Categories:
  - Reading
  - Science & Education
License: GPL-3.0-only
SourceCode: https://github.com/TarishAhmed/qaida
IssueTracker: https://github.com/TarishAhmed/qaida/issues
Changelog: https://github.com/TarishAhmed/qaida/blob/main/CHANGELOG.md

AutoName: Qaida

RepoType: git
Repo: https://github.com/TarishAhmed/qaida.git

Builds:
  - versionName: 1.0.0
    versionCode: 10000
    commit: v1.0.0
    subdir: app
    gradle:
      - release

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 1.0.0
CurrentVersionCode: 10000
