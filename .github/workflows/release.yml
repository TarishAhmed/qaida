name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      # The version lives in app/build.gradle.kts; the tag must agree with it, versionCode included.
      - name: Check tag matches the declared version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must be vMAJOR.MINOR.PATCH, got $GITHUB_REF_NAME" >&2; exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          DECLARED_NAME=$(sed -nE 's/^ *versionName = "([^"]+)"/\1/p' app/build.gradle.kts)
          DECLARED_CODE=$(sed -nE 's/^ *versionCode = ([0-9]+)/\1/p' app/build.gradle.kts)
          if [ "$DECLARED_NAME" != "$VERSION" ] || [ "$DECLARED_CODE" != "$CODE" ]; then
            echo "Tag $GITHUB_REF_NAME (code $CODE) does not match build.gradle.kts ($DECLARED_NAME, code $DECLARED_CODE)" >&2; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Only fully verified content makes a real release. Until then the build is a preview on the
      # unverified pack, installed as a separate app (in.qaida.app.preview) and published as a pre-release.
      - name: Choose build
        run: |
          if ./gradlew -q checkReleaseContent --console=plain; then
            echo "KIND=release" >> "$GITHUB_ENV"
          else
            echo "KIND=preview" >> "$GITHUB_ENV"
          fi

      - name: Restore signing key
        env:
          QAIDA_KEYSTORE_B64: ${{ secrets.QAIDA_KEYSTORE_B64 }}
        run: |
          if [ -z "$QAIDA_KEYSTORE_B64" ]; then echo "QAIDA_KEYSTORE_B64 secret is missing" >&2; exit 1; fi
          echo "$QAIDA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/qaida-release.jks"
          echo "QAIDA_KEYSTORE=$RUNNER_TEMP/qaida-release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          QAIDA_KEYSTORE_PASSWORD: ${{ secrets.QAIDA_KEYSTORE_PASSWORD }}
          QAIDA_KEY_ALIAS: ${{ secrets.QAIDA_KEY_ALIAS }}
          QAIDA_KEY_PASSWORD: ${{ secrets.QAIDA_KEY_PASSWORD }}
        run: |
          TASK="assemble${KIND^}"
          ./gradlew test "$TASK" --console=plain

      - name: Verify signature and package
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          SRC="app/build/outputs/apk/$KIND/app-$KIND.apk"
          "$APKSIGNER" verify --print-certs "$SRC" | tee signer.txt
          if [ "$KIND" = preview ]; then OUT="qaida-$VERSION-preview.apk"; else OUT="qaida-$VERSION.apk"; fi
          cp "$SRC" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "CERT=$(grep -m1 'SHA-256' signer.txt | awk '{print $NF}')" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$KIND" = preview ]; then
            {
              echo "**Preview build: the recordings have not yet been checked by a fluent reader.**"
              echo
              echo "Letter recordings come from Wikimedia Commons and are matched to letters by file name; some may be"
              echo "filed under the wrong letter. Settings > Check the recordings lets a reader confirm each one."
              echo "Installs as a separate app (\`in.qaida.app.preview\`) and never updates into the real Qaida app."
            } > notes.md
            PRERELEASE=--prerelease
            TITLE="Qaida $VERSION (preview)"
          else
            echo "Qaida $VERSION" > notes.md
            PRERELEASE=
            TITLE="Qaida $VERSION"
          fi
          {
            echo
            echo "- No internet permission. Nothing leaves the device."
            echo "- SHA-256 of the APK: \`$(cut -d' ' -f1 "$OUT.sha256")\`"
            echo "- Signing certificate SHA-256: \`$CERT\`"
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" "$OUT" "$OUT.sha256" --title "$TITLE" --notes-file notes.md $PRERELEASE
