name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      # assemble* also runs verify*ManifestPermissions: any permission outside the allowlist fails the build.
      - name: Test and assemble
        run: ./gradlew test assembleDebug assemblePreview --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: qaida-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  reproducible:
    name: Reproducible build and network-free manifest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the unsigned preview twice from clean and compare
        run: |
          ./gradlew clean assemblePreview --no-build-cache --console=plain
          sha256sum app/build/outputs/apk/preview/app-preview-unsigned.apk | tee first.sha256
          ./gradlew clean assemblePreview --no-build-cache --console=plain
          sha256sum -c first.sha256
      - name: No network permission in any merged manifest
        run: |
          ./gradlew verifyDebugManifestPermissions verifyPreviewManifestPermissions verifyReleaseManifestPermissions --console=plain
          if grep -rE 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_NETWORK_STATE)' app/build/intermediates/merged_manifest/; then
            echo "network permission found in a merged manifest" >&2; exit 1
          fi

  instrumented:
    name: Session flow on emulator (API 30)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          ram-size: 2048M
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --console=plain
      - name: Upload instrumented test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/
